<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181210">
  <!-- Apply saved theme before CSS loads to prevent flash -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('re4_bingo_theme') || 'dark';
  </script>
  <title>Resident Evil 4 Bingo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>Resident Evil 4 Bingo</h1>
    <div class="controls">
      <div class="control-row">
        <label for="sourceSelect">Source:</label>
        <select id="sourceSelect">
          <option value="Original">Original Only</option>
          <option value="All">Original + Extras</option>
        </select>
        <button id="regenerateBoard">Regenerate</button>
        <button id="themeToggle">Light Mode</button>
      </div>
      <div class="control-row">
        <button id="toggleMode">Solo / Multiplayer</button>
        <details id="playerNamesDetails" class="hidden">
          <summary id="playerNamesSummary">Player 1 vs Player 2</summary>
          <div class="player-names-panel">
            <input type="text" id="player1Name" value="Player 1" maxlength="20" placeholder="Player 1" aria-label="Player 1 name">
            <input type="text" id="player2Name" value="Player 2" maxlength="20" placeholder="Player 2" aria-label="Player 2 name">
            <button id="applyNames">Apply</button>
          </div>
        </details>
        <button id="switchPlayer" class="hidden">Switch Player</button>
      </div>
      <p id="status">Solo Mode</p>
    </div>
  </header>

  <div id="winBanner" class="win-banner hidden"></div>

  <main>
    <div class="bingo-board" id="bingoBoard"></div>
  </main>

  <script type="module" src="./js/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./js/service-worker.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
